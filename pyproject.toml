[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoharmony"
version = "0.1.0"
description = "HarmonyOS UI testing toolchain for AI agents. Agent explores once, script reused forever."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["harmonyos", "ui-testing", "ai-agent", "automation", "hypium", "uitest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
autoharmony = "autoharmony:main"

[project.optional-dependencies]
semantic = ["hypium"]

[tool.setuptools]
py-modules = ["autoharmony"]

[tool.setuptools.packages.find]
include = ["engines*", "analyzers*", "utils*", "bridge*"]